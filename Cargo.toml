[package]
name = "everything-mcp-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lite Everything file-search MCP server: 2 tools, minimal output"
license = "MIT"

[lib]
name = "everything_mcp_lite"

[[bin]]
name = "everything-mcp-lite"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client", "transport-child-process"] }
serde_json = "1"
